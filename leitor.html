
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAIMO TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:white;font-family:Arial,sans-serif}
header{padding:22px;background:#19171d;border-bottom:1px solid #333}
h1{margin:0;font-size:25px}
p{color:#aaa;font-size:13px}
main{padding:16px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#222;color:white;font-size:16px}
#status{color:#aaa;margin:15px 0;font-size:14px}
#lista{display:grid;gap:8px}
.item{background:#1c1a20;padding:13px;border-radius:9px;border:1px solid #302d35;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>SAIMO TV</h1>
<p>Catálogo de canais</p>
</header>
<main>
<input id="busca" placeholder="Buscar canal...">
<div id="status">Carregando catálogo...</div>
<div id="lista"></div>
</main>
<script>
const URL="https://cdn.jsdelivr.net/gh/icarosaroka2-sketch/saimo-catalogos@main/canais.txt";
let linhas=[];

async function carregar(){
 const status=document.getElementById("status");
 try{
  const resposta=await fetch(URL);
  if(!resposta.ok) throw new Error("Erro "+resposta.status);
  const texto=await resposta.text();
  linhas=texto.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  mostrar(linhas);
 }catch(e){
  status.textContent="Erro ao carregar catálogo: "+e.message;
 }
}

function mostrar(dados){
 const lista=document.getElementById("lista");
 document.getElementById("status").textContent=dados.length+" itens encontrados";
 lista.innerHTML="";
 dados.forEach(nome=>{
  const div=document.createElement("div");
  div.className="item";
  div.textContent=nome;
  lista.appendChild(div);
 });
}

document.getElementById("busca").addEventListener("input",e=>{
 const termo=e.target.value.toLowerCase();
 mostrar(linhas.filter(x=>x.toLowerCase().includes(termo)));
});

carregar();
</script>
</body>
</html>
